<!DOCTYPE html>
<html>
<head>
    <title>RAG Chatbot</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 350px;
            height: 600px;
            background: white;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        /* Header */
        .header {
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }

        .header h3 {
            margin: 0;
        }

        .status {
            font-size: 12px;
            color: green;
        }

        /* Chat area */
        #chat {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #f7f7f7;
            display: flex;
            flex-direction: column;
        }

        /* Messages */
        .message {
            margin: 8px 0;
            padding: 10px 12px;
            border-radius: 12px;
            max-width: 70%;
            width: fit-content;
            word-wrap: break-word;
        }

        .bot {
            background: #e0e0e0;
            align-self: flex-start;
        }

        .user {
            background: #4a6cf7;
            color: white;
            align-self: flex-end;
        }

        /* Quick buttons */
        .quick {
            padding: 10px;
            border-top: 1px solid #eee;
        }

        .quick button {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px;
            border-radius: 20px;
            border: 1px solid #4a6cf7;
            background: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .quick button:hover {
            background: #4a6cf7;
            color: white;
        }

        /* Input */
        .input-box {
            display: flex;
            border-top: 1px solid #ddd;
        }

        input {
            flex: 1;
            padding: 12px;
            border: none;
            outline: none;
        }

        button.send {
            padding: 12px;
            background: #4a6cf7;
            color: white;
            border: none;
            cursor: pointer;
        }

        button.send:hover {
            background: #3b5bdb;
        }
    </style>
</head>

<body>

<div class="chat-container">

    <!-- Header -->
    <div class="header">
        <h3>🤖 RAG Chatbot</h3>
        <div class="status">Online</div>
    </div>

    <!-- Chat -->
    <div id="chat">
        <div class="message bot">Hello 👋 I'm your AI assistant.</div>
        <div class="message bot">Ask questions based on your uploaded documents.</div>
    </div>

    <!-- Quick buttons -->
    <div class="quick">
        <button onclick="quickAsk('What is this document about?')">📄 Document Summary</button>
        <button onclick="quickAsk('Explain key points')">📌 Key Points</button>
        <button onclick="quickAsk('Give important highlights')">⭐ Highlights</button>
    </div>

    <!-- Input -->
    <div class="input-box">
        <input id="query" placeholder="Ask something..." onkeypress="handleKey(event)">
        <button class="send" onclick="sendMessage()">➤</button>
    </div>

</div>

<script>
async function sendMessage(text=null) {

    const input = document.getElementById("query");
    const chat = document.getElementById("chat");

    const userText = text || input.value.trim();
    if (!userText) return;

    // User message
    chat.innerHTML += `<div class="message user">${userText}</div>`;
    input.value = "";

    // Loading
    chat.innerHTML += `<div class="message bot" id="loading">Typing...</div>`;
    chat.scrollTop = chat.scrollHeight;

    try {
        const res = await fetch("http://127.0.0.1:8000/ask", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({query: userText})
        });

        const data = await res.json();

        document.getElementById("loading").remove();

        // Bot response
        chat.innerHTML += `<div class="message bot">${data.answer}</div>`;
        chat.scrollTop = chat.scrollHeight;

    } catch {
        document.getElementById("loading").remove();
        chat.innerHTML += `<div class="message bot">Server error</div>`;
    }
}

// Enter key
function handleKey(e){
    if(e.key === "Enter") sendMessage();
}

// Quick buttons
function quickAsk(text){
    sendMessage(text);
}
</script>

</body>
</html>
